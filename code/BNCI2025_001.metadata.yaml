  - IClabel plugin
  bandpass:
    high_cutoff_hz: 80.0
    low_cutoff_hz: 0.3
  data_state: preprocessed with eye artifact correction
  downsampled_to_hz: 200.0
  epoch_window:
  - -3.0
  - 4.0
  filter_order: 2
  filter_type: Butterworth
  highpass_hz: 0.3
  lowpass_hz: 100.0
  notch_hz:
  - 50
  notes: Frontal channels (AF7, AF3, AFz, AF4, AF8) and EOG removed prior to CAR to reduce residual eye artifacts. Final analysis
    used 55 channels. Eye blocks recorded separately for SGEYESUB model training. Bad trials rejected based on amplitude >200
    µV or standard deviation >5SD. Movement-related bad trials rejected for incorrect direction, no movement, duration <0.2s
    or >4s, or movement initiated <0.5s after cue stop.
  preprocessing_applied: true
  preprocessing_steps:
  - low-pass filter at 100 Hz
  - notch filter at 50 Hz
  - downsampling to 200 Hz
  - bad channel rejection and interpolation
  - bandpass filter 0.3-80 Hz
  - eye artifact correction via SGEYESUB
  - ICA with FastICA algorithm
  - IC artifact removal
  - low-pass filter at 3 Hz
  - downsampling to 10 Hz
  - bad trial rejection
  - common average reference
  re_reference: common average
