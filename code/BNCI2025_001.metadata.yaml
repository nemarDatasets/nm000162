  n_subjects: 20
  paradigm: imagery
abstract: 'Objective. The complicated processes of carrying out a hand reach are still far from fully understood. In order
  to further the understanding of the kinematics of hand movement, the simultaneous representation of speed, distance, and
  direction in the brain is explored. Approach. We utilized electroencephalography (EEG) signals and hand position recorded
  during a four-direction center-out reaching task with either quick or slow speed, near and far distance. Linear models were
  employed in two modes: decoding and encoding. First, to test the discriminability of speed, distance, and direction. Second,
  to find the contribution of the cortical sources via the source localization. Additionally, we compared the decoding accuracy
  when using features obtained from EEG signals and source-localized EEG signals based on the results from the encoding model.
  Main results. Speed, distance, and direction can be classified better than chance. The accuracy of the speed was also higher
  than the distance, indicating a stronger representation of the speed than the distance. The speed and distance showed similar
  significant sources in the central regions related to the movement initiation, while the direction indicated significant
  sources in the parieto-occipital regions related to the movement preparation. The combination of the features from EEG and
  source localized signals improved the classification. Significance. Directional and non-directional information are represented
  in two separate networks. The quick movement resulted in improvement in the direction classification. Our results enhance
  our understanding of hand movement in the brain and help us make informed decisions when designing an improved paradigm
  in the future.'
